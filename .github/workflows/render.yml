# Cloud render — free GitHub runners instead of the 2 GB sandbox.
#
# On a PUBLIC repo, GitHub-hosted ubuntu-latest is 4 vCPU / 16 GB / 14 GB SSD with
# unlimited free minutes. That is 8x the RAM and several times the CPU of the
# workspace sandbox, and it removes the ceiling that forced every memory
# workaround in islamic/. Renders that need the whole 2 GB locally run here with
# room to spare.
#
# Shape of the run:
#   plan    read library.json -> a matrix of {slug, ref, topic}
#   render  one runner per clip, up to 5 in parallel; each renders, is gated by
#           tools/check_video.py, and uploads ONLY its own mp4 + build record
#   publish one runner collects the artifacts, uploads the media to a GitHub
#           Release, and commits ONLY the manifest + build records (text)
#   pages   deploys the site, pulling the media back out of the Release
#
# Media never enters git. Until 2026-10-11 this job committed the mp4s into
# web/video/, every re-render added ~11 MB of permanent history, and the repo
# needed three history rewrites in one day to stay under the workspace limit.
# Now web/video/*.mp4 and posters are git-ignored, the Release is the store,
# and pages.yml assembles the site at deploy time.
#
# No secrets are needed. The automatic GITHUB_TOKEN covers the release and the
# commit; nothing here requires a personal access token, and none may be added.
#
#   gh workflow run render.yml -f only="quran-81-8"
#   gh workflow run render.yml                       # everything in library.json

name: render

on:
  workflow_dispatch:
    inputs:
      only:
        description: 'Subset to render: slugs or refs, space/comma separated. Empty = every clip in library.json.'
        required: false
        default: ''
      tag:
        description: 'Release tag for the masters (default renders-YYYY-MM-DD)'
        required: false
        default: ''
      sync_site:
        description: 'Commit the rendered set into web/ so Pages serves it'
        required: false
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  # Never two renders at once: both would commit web/ and race each other.
  group: render
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      clips: ${{ steps.p.outputs.clips }}
      tag: ${{ steps.p.outputs.tag }}
      count: ${{ steps.p.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        name: Read library.json
        env:
          ONLY: ${{ inputs.only }}
          TAG: ${{ inputs.tag }}
        run: python3 tools/plan_render.py --only "$ONLY" --tag "$TAG" --github-output >> "$GITHUB_OUTPUT"

      # The gates are tested before any runner is spent on a render. A broken
      # gate must stop the run, not silently pass everything through it.
      - name: Test the gates
        run: python3 -m unittest discover -s tests -v

      # Authenticity, before any render: Qur'an text agreed letter-for-letter by
      # two independent sources, hadith graded sahih/hasan with no grader
      # dissenting. One failure stops the whole run - a clip planned on a weak
      # narration is a planning error, not something to render around.
      - name: Authenticity gate
        run: python3 -m islamic.verify --library

  render:
    name: render ${{ matrix.clip.slug }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        clip: ${{ fromJSON(needs.plan.outputs.clips) }}
    steps:
      - uses: actions/checkout@v4

      # pip wheels and the voice models are the big downloads. Keyed on the
      # files that pin them, so an unrelated change does not refetch ~1.5 GB.
      # `kokoro` is the English narration voice (353 MB) and `urdu-voice` the
      # Urdu one (63 MB); the cache key names both model files so a change to
      # either invalidates it.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/pip
            ~/.cache/huggingface
            ~/.cache/urdu-voice
            ~/.cache/kokoro
          key: voice-${{ runner.os }}-${{ hashFiles('setup.sh', 'islamic/voice.py', 'islamic/kokoro.py', 'naat/tts.py') }}
          restore-keys: voice-${{ runner.os }}-

      - name: Toolchain
        run: bash setup.sh

      - name: Render ${{ matrix.clip.ref }}
        run: |
          python3 -m islamic.produce \
            --ref "${{ matrix.clip.ref }}" \
            --topic "${{ matrix.clip.topic }}" \
            --out output/video

      - name: Gate the clip
        run: |
          python3 tools/check_video.py \
            "output/video/${{ matrix.clip.slug }}.mp4" \
            --build-json "output/video/${{ matrix.clip.slug }}.build.json" \
            --min-seconds 6 \
            ${{ matrix.clip.require_audio && '--require-audio' || '' }}

      # Defence in depth. The plan job already refuses a mismatch, but a
      # single-clip dispatch (--only) can reach a runner without going through
      # it. This re-checks the topic against the body that was just rendered,
      # read back off disk, so the check is on the artefact and not the plan.
      - name: Gate the topic
        run: python3 tools/check_relevance.py --clip "${{ matrix.clip.slug }}" --offline

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: clip-${{ matrix.clip.slug }}
          if-no-files-found: error
          retention-days: 14
          path: |
            output/video/${{ matrix.clip.slug }}.mp4
            output/video/${{ matrix.clip.slug }}.build.json

  publish:
    name: publish
    needs: [plan, render]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Only the two files each runner produced. There is deliberately no shared
      # cumulative index to merge: publish.py describes every clip from its own
      # build record.
      - uses: actions/download-artifact@v4
        with:
          pattern: clip-*
          merge-multiple: true
          path: output/video

      - name: Report what arrived
        run: ls -la output/video

      - name: Build the site
        # Not --exact: rendering a subset must leave the rest of the library on
        # the site rather than pruning it. --release records, per clip, which
        # Release holds its media, so pages.yml can fetch it back.
        env:
          TAG: ${{ needs.plan.outputs.tag }}
        run: python3 tools/publish.py --release "$TAG" --prune-posters

      - name: Verify the site
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          m = json.loads(pathlib.Path("web/video/manifest.json").read_text(encoding="utf-8"))
          n = m["count"]
          print(f"manifest lists {n} clip(s)")
          # every clip names the Release that holds it, or Pages cannot build
          bad = [i["file"] for i in m["items"] if not i.get("release")]
          if bad:
              sys.exit(f"manifest items with no release to serve them from: {bad}")
          if n == 0:
              sys.exit("manifest is empty")
          PY

      - name: Release the masters
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          set -euo pipefail
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" \
                 --notes "Cloud renders from library.json. Masters for the web set."
          # Only this run's clips: carried-forward ones already live in the
          # Release their manifest entry names.
          shopt -s nullglob
          files=(output/video/*.mp4 output/video/*.build.json)
          for m in output/video/*.mp4; do
            p="web/video/posters/$(basename "${m%.mp4}").jpg"
            [ -f "$p" ] && files+=("$p")
          done
          gh release upload "$TAG" "${files[@]}" --clobber
          # A carried-forward clip from an older release must still be there.
          python3 tools/fetch_media.py --check

      - name: Commit the site
        if: ${{ inputs.sync_site }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # .gitignore keeps the mp4s and posters out; this stages the
          # manifest and the build records only. Assert it, rather than trust it.
          git add -A web/video
          if git diff --cached --name-only | grep -E '\.(mp4|jpg)$'; then
            echo "refusing to commit media into git (see .gitignore)"; exit 1
          fi
          if git diff --cached --quiet; then
            echo "site already matches the render — nothing to commit"
          else
            git commit -m "Cloud render: refresh web/video (${{ needs.plan.outputs.count }} clip(s), tag ${{ needs.plan.outputs.tag }})"
            # Push to the branch this run was dispatched on, explicitly: a
            # detached HEAD must not be able to push nowhere and report success.
            git push origin "HEAD:${{ github.ref_name }}"
          fi

  pages:
    name: deploy site
    needs: publish
    if: ${{ inputs.sync_site }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/pages.yml
